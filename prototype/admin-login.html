<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - GenSa Berilmu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <svg viewBox="0 0 24 24" class="login-icon" aria-hidden="true"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1>Admin Panel</h1>
        <p>Masuk ke panel manajemen GenSa Berilmu</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="admin@gensaberilmu.co.id">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Masukkan password">
        </div>
        <p class="login-error" id="loginError" style="display:none;"></p>
        <button type="submit" class="btn btn-solid login-submit">Masuk</button>
        <p class="login-hint">Gunakan email <strong>admin@gensaberilmu.co.id</strong> untuk demo</p>
      </form>
    </div>
  </div>

<script>
(function() {
  'use strict';
  var ADMIN_KEY = 'gensaberilmu_admin';
  if (localStorage.getItem(ADMIN_KEY)) {
    window.location.href = 'admin.html';
    return;
  }
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim().toLowerCase();
    var pass = document.getElementById('password').value;
    var err = document.getElementById('loginError');
    if (email === 'admin@gensaberilmu.co.id' && pass === 'admin123') {
      localStorage.setItem(ADMIN_KEY, JSON.stringify({ email: email, name: 'Admin', role: 'superadmin', loginAt: new Date().toISOString() }));
      window.location.href = 'admin.html';
    } else {
      err.textContent = 'Email atau password salah.';
      err.style.display = 'block';
    }
  });
})();
</script>
</body>
</html>
